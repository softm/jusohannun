<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1768dc"><title>주소한눈 | 도로명주소 검색</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#17243b;font-family:system-ui,-apple-system,sans-serif}header{background:#fff;border-bottom:1px solid #e3e9f2;padding:18px 20px}.wrap{max-width:850px;margin:auto}h1{font-size:30px;margin:0 0 8px}main{padding:30px 18px}p{color:#66758c}.search{display:flex;gap:8px;margin:22px 0}.search input{flex:1;min-width:0}input{font:inherit;padding:13px;border:1px solid #d3dce8;border-radius:10px;width:100%}button{cursor:pointer;border:1px solid #d1dbe8;border-radius:9px;padding:10px 13px;background:#fff;color:#253653;font:inherit}button.primary{background:#1768dc;color:white;border-color:#1768dc}.panel{background:#fff;border:1px solid #e3e9f2;border-radius:16px;padding:20px;margin-bottom:15px}.tabs{display:flex;gap:8px;margin:15px 0}.tabs button.active{background:#e8f1ff;color:#145ac0;border-color:#a7c9f8}.result{padding:17px 0;border-bottom:1px solid #e6ebf2}.result:last-child{border-bottom:0}.address{font-weight:700;font-size:18px;margin:8px 0}.muted{color:#64748b;font-size:13px;line-height:1.7}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.actions button{font-size:13px}.zip{color:#1768dc;font-weight:700}.settings{display:none}.settings.open{display:block}.settings input{margin:10px 0}.pagination{display:flex;align-items:center;justify-content:center;gap:15px;margin:20px}.empty{padding:24px;text-align:center;color:#66758c}footer{text-align:center;padding:30px;color:#78879a;font-size:12px}@media(max-width:500px){h1{font-size:24px}.panel{padding:15px}.search button{padding:10px}}
</style></head><body><header><div class="wrap" style="display:flex;align-items:center;justify-content:space-between"><strong>⌖ 주소한눈</strong><button id="config">⚙ API 설정</button></div></header><main class="wrap"><h1>찾고 싶은 주소, 한눈에</h1><p>도로명주소 · 지번주소 · 건물명 · 우편번호 검색</p><form class="search" id="form"><input id="query" placeholder="예: 세종대로 110, 서울시청" aria-label="주소 검색어"><button class="primary">검색</button></form><section class="panel settings" id="settings"><b>주소 검색 API 설정</b><p>Cloudflare Worker HTTPS 주소를 입력하세요. API 승인키는 브라우저에 저장하지 않습니다.</p><input id="endpoint" placeholder="https://jusohannun-api.example.workers.dev"><button id="save" class="primary">설정 저장</button></section><nav class="tabs"><button data-tab="search" class="active">검색 결과</button><button data-tab="recent">최근 검색</button><button data-tab="favorites">즐겨찾기</button></nav><section class="panel"><b id="status">주소를 검색해 보세요.</b><div id="results" aria-live="polite"></div><div class="pagination" id="paging" hidden><button id="prev">이전</button><span id="page"></span><button id="next">다음</button></div></section></main><footer>주소한눈 · 행정안전부 공식 도로명주소 API 기반</footer><script>
const el=id=>document.getElementById(id),read=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch{return []}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab='search',records=[],total=0,page=1,serial=0;const key=r=>r.bdMgtSn||r.roadAddr+'|'+r.zipNo;function add(k,r){write(k,[r,...read(k).filter(x=>key(x)!==key(r))].slice(0,50))}function render(items){el('results').replaceChildren();if(!items.length){el('results').innerHTML='<div class="empty">표시할 주소가 없습니다.</div>';return}items.forEach(r=>{const a=document.createElement('article');a.className='result';a.innerHTML='<span class="zip">'+esc(r.zipNo)+'</span><div class="address">'+esc(r.roadAddr||r.jibunAddr)+'</div><div class="muted">지번: '+esc(r.jibunAddr)+'</div><div class="muted">영문: '+esc(r.engAddr)+'</div><div class="muted">건물관리번호: '+esc(r.bdMgtSn)+'</div><div class="actions"><button data-a="copy">주소 복사</button><button data-a="zip">우편번호 복사</button><button data-a="fav">☆ 즐겨찾기</button><button data-a="map">지도</button><button data-a="share">공유</button></div>';a.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{let v=b.dataset.a;if(v==='fav'){const list=read('jh_fav');if(list.some(x=>key(x)===key(r)))write('jh_fav',list.filter(x=>key(x)!==key(r)));else add('jh_fav',r);b.textContent='✓ 저장됨';if(tab==='favorites')switchTab(tab);return}if(v==='map'){window.open('https://map.naver.com/p/search/'+encodeURIComponent(r.roadAddr||r.jibunAddr),'_blank','noopener');return}const value=v==='zip'?r.zipNo:r.roadAddr||r.jibunAddr;if(v==='share'&&navigator.share){try{await navigator.share({text:value});return}catch{return}}try{await navigator.clipboard.writeText(value);b.textContent='✓ 복사됨'}catch{alert('복사에 실패했습니다')}});el('results').append(a)})}function switchTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));el('paging').hidden=t!=='search'||total<=10;el('status').textContent=t==='search'?'검색 결과 '+total.toLocaleString()+'건':t==='recent'?'최근 검색':'즐겨찾기';render(t==='search'?records:read(t==='recent'?'jh_recent':'jh_fav'))}async function search(p=1){const q=el('query').value.trim();if(q.length<2){alert('2자 이상 입력하세요');return}const endpoint=localStorage.getItem('jh_endpoint');if(!endpoint){el('settings').classList.add('open');el('status').textContent='API 주소를 먼저 설정하세요';return}const id=++serial;page=p;el('status').textContent='검색 중…';el('results').replaceChildren();try{const url=new URL(endpoint);url.searchParams.set('keyword',q);url.searchParams.set('currentPage',p);url.searchParams.set('countPerPage',10);const res=await fetch(url,{signal:AbortSignal.timeout(12000)}),data=await res.json();if(id!==serial)return;if(!res.ok)throw Error(data.error||'API 요청 실패');const common=data.results?.common||{};if(common.errorCode&&common.errorCode!=='0')throw Error(common.errorMessage);records=data.results?.juso||[];total=Number(common.totalCount||0);records.forEach(r=>add('jh_recent',r));switchTab('search');el('page').textContent=p+' / '+Math.max(1,Math.ceil(total/10));el('prev').disabled=p===1;el('next').disabled=p>=Math.ceil(total/10)}catch(e){el('status').textContent='검색 실패: '+e.message}}el('form').onsubmit=e=>{e.preventDefault();search()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));el('config').onclick=()=>el('settings').classList.toggle('open');el('endpoint').value=localStorage.getItem('jh_endpoint')||'';el('save').onclick=()=>{try{const url=new URL(el('endpoint').value.trim());if(url.protocol!=='https:')throw Error();localStorage.setItem('jh_endpoint',url.origin+url.pathname);el('settings').classList.remove('open');alert('저장되었습니다')}catch{alert('HTTPS 주소를 입력하세요')}};el('prev').onclick=()=>search(page-1);el('next').onclick=()=>search(page+1);switchTab('search');
</script></body></html>
